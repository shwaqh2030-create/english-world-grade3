<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English World | Let's Play!</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#ffe2b1,#ffe7d6 45%,#f9d4ed);font-family:system-ui,-apple-system,Arial,sans-serif;color:#54345f;display:flex;justify-content:center;align-items:center;padding:18px}.game{width:min(100%,490px);background:#fff9f6;border:3px solid #fff;border-radius:26px;padding:24px;box-shadow:0 12px 38px #b55e9440;text-align:center}h1{color:#974f9a;font-size:30px;margin:10px 0}.sub{color:#aa679d;font-weight:700}.progress{height:11px;background:#eedce9;border-radius:30px;overflow:hidden;margin:22px 0}.bar{height:100%;background:#bc72b4;transition:width .25s}.top{display:flex;justify-content:space-between;font-weight:700}.question{font-size:28px;font-weight:800;background:white;padding:30px 8px;border-radius:18px;margin:20px 0}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{font-size:22px;font-weight:800;border:2px solid #e7cde3;border-radius:14px;background:white;color:#60356c;padding:18px 5px;cursor:pointer}.choice:disabled{cursor:default}.correct{background:#c8efd8;border-color:#54ae79}.wrong{background:#f8d0d0;border-color:#e68181}.feedback{font-size:17px;font-weight:700;min-height:48px;margin:18px 0}.next{border:0;border-radius:14px;padding:14px 26px;background:#9856a4;color:white;font-size:18px;font-weight:750;cursor:pointer;width:100%}.next:disabled{opacity:.4;cursor:default}.footer{margin-top:25px;color:#a46a9b;font-size:14px}.hidden{display:none}.result{font-size:58px;font-weight:900;color:#874491;margin:12px 0}.small{font-size:14px}</style></head><body><main class="game"><div class="sub">🌸 English World | Grade 3</div><h1>🎮 Let's Play!</h1><div id="play"><div class="top"><span id="count">Question 1 / 6</span><span id="points">⭐ 0 points</span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="small">Choose the correct answer</div><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next" disabled>Next Question →</button></div><div id="finish" class="hidden"><h2>🏆 Great Job!</h2><div class="result" id="finalScore"></div><p id="finalMessage"></p><button class="next" id="again">🔄 Play Again</button><p class="small">اكتبي نتيجتك في تعليقات Padlet 🌸</p></div><div class="footer">Your Teacher: Ashwaq Aljaza 💕</div></main><script>const qs=[['I ___ happy. 😊',0],['She ___ a student. 👧',1],['They ___ friends. 👭',2],['He ___ my brother. 👦',1],['We ___ happy. 🌸',2],['You ___ a star! ⭐',2]];const opts=['am','is','are'];let i=0,score=0,selected=false;const el=id=>document.getElementById(id);function render(){selected=false;el('count').textContent=`Question ${i+1} / ${qs.length}`;el('points').textContent=`⭐ ${score} points`;el('bar').style.width=`${(i/qs.length)*100}%`;el('question').textContent=qs[i][0];el('feedback').textContent='';el('next').disabled=true;el('next').textContent=i===qs.length-1?'See My Score 🏆':'Next Question →';el('choices').innerHTML='';opts.forEach((word,n)=>{const b=document.createElement('button');b.className='choice';b.textContent=word;b.addEventListener('click',()=>answer(n));el('choices').appendChild(b)})}function answer(n){if(selected)return;selected=true;const right=qs[i][1];if(n===right)score++;[...el('choices').children].forEach((b,j)=>{b.disabled=true;if(j===right)b.classList.add('correct');else if(j===n)b.classList.add('wrong')});el('feedback').textContent=n===right?'🌟 Excellent! Correct answer!':`💗 Good try! The answer is ${opts[right]}`;el('points').textContent=`⭐ ${score} points`;el('next').disabled=false}el('next').addEventListener('click',()=>{i++;if(i===qs.length){el('play').classList.add('hidden');el('finish').classList.remove('hidden');el('finalScore').textContent=`${score} / ${qs.length}`;el('finalMessage').textContent=score===6?"Amazing! You're an English Star! 🌟":"Keep practicing, little star! 💕"}else render()});el('again').addEventListener('click',()=>{i=0;score=0;el('finish').classList.add('hidden');el('play').classList.remove('hidden');render()});render();</script></body></html>
